name: Build E87N Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget qemu-utils libelf-dev jq ccache autoconf automake libtool \
            pkg-config
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: dl-

      - name: Pin luci feed to openwrt-25.12
        run: |
          # luci 的 master 分支在 luci.mk 里定义了 LUCI_UT_MIN_UCODE?=2026.02.27，
          # 会给所有 luci 包加上 `ucode>=2026.02.27` 依赖；而本源码树（25.12）自带的
          # package/utils/ucode 是 2026-01-16，两者冲突，导致最后 package/install
          # 阶段报 "ERROR: unable to select packages"（Error 35）。
          # 把 luci feed 锁定到与源码树匹配的 openwrt-25.12 分支即可。
          cp -f feeds.conf.default feeds.conf.default.orig
          sed -i -E 's#^src-git luci .*#src-git luci https://github.com/openwrt/luci.git;openwrt-25.12#' feeds.conf.default
          grep -E '^src-git luci' feeds.conf.default
          grep -q 'luci.git;openwrt-25.12' feeds.conf.default || { echo "::error::luci feed 分支锁定失败"; exit 1; }

      - name: Add OpenClash
        run: |
          # 将 OpenClash 源码克隆到 package 目录下
          git clone --depth=1 https://github.com/vernesong/OpenClash package/luci-app-openclash

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load E87N config
        run: |
          cp e87n.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config \
            || { echo "::error::目标设备不是 edgepi_e87n，配置未生效"; exit 1; }

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          export GO111MODULE=on
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -nE "Error [0-9]|No space left|ERROR:|error:|Hash mismatch|Download failed|failed to build" build.log | tail -n 60 || true
          echo "===== 磁盘占用 ====="
          df -h /
          du -sh dl build_dir staging_dir bin 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-firmware
          path: bin/targets/mediatek/filogic/*.bin
          if-no-files-found: error
