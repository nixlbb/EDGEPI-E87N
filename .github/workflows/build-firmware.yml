name: Build E87N Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget \
            autoconf automake libtool libelf-dev pkg-config ccache
          df -h /

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: dl-

      - name: Pin luci feed to openwrt-25.12
        run: |
          # luci 的 master 分支在 luci.mk 里定义了 LUCI_UT_MIN_UCODE?=2026.02.27，
          # 会给所有 luci 包加上 `ucode>=2026.02.27` 依赖；而本源码树（25.12）自带的
          # package/utils/ucode 是 2026-01-16，两者冲突，导致最后 package/install
          # 阶段报 "ERROR: unable to select packages"（Error 35）。
          # 把 luci feed 锁定到与源码树匹配的 openwrt-25.12 分支即可。
          cp -f feeds.conf.default feeds.conf.default.orig
          sed -i -E 's#^src-git luci .*#src-git luci https://github.com/openwrt/luci.git;openwrt-25.12#' feeds.conf.default
          grep -E '^src-git luci' feeds.conf.default
          grep -q 'luci.git;openwrt-25.12' feeds.conf.default || { echo "::error::luci feed 分支锁定失败"; exit 1; }

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix samba4 relative include paths
        run: |
          # package/samba4 是从 feeds/packages 复制到仓库根的，其 `include ../../lang/...`
          # 这类 feeds 式相对路径在当前位置解析不到（且 python3-host.mk 还会按自身路径
          # 继续 include ../rust/rust-values.mk），因此直接改成绝对路径
          sed -i -E 's#^([[:space:]]*)include[[:space:]]+\.\./\.\./lang/#\1include $(TOPDIR)/feeds/packages/lang/#' package/samba4/Makefile
          grep -n 'TOPDIR)/feeds/packages/lang' package/samba4/Makefile
          [ "$(grep -c 'TOPDIR)/feeds/packages/lang' package/samba4/Makefile)" = "3" ] \
            || { echo "::error::samba4 Makefile 改写失败"; exit 1; }

          # 兜底：仓库根提供 lang 目录（符号链接到 feeds），兼容任何残余的 ../ 引用
          rm -rf lang
          ln -sfn "$PWD/feeds/packages/lang" "$PWD/lang"

          # 关键依赖齐全性检查：缺任何一个都会在编译 3 小时后才炸
          for f in \
            feeds/packages/lang/perl/perlver.mk \
            feeds/packages/lang/python/python3-host.mk \
            feeds/packages/lang/python/python3-package.mk \
            feeds/packages/lang/python/python3-version.mk \
            feeds/packages/lang/rust/rust-values.mk ; do
            [ -f "$f" ] || { echo "::error::缺少依赖 $f"; exit 1; }
          done
          echo "samba4 include 依赖检查通过"

      - name: Load E87N config
        run: |
          cp e87n.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config \
            || { echo "::error::目标设备不是 edgepi_e87n，配置未生效"; exit 1; }

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -nE "Error [0-9]|No space left|ERROR:|error:|Hash mismatch|Download failed|failed to build" build.log | tail -n 60 || true
          echo "===== 磁盘占用 ====="
          df -h /
          du -sh dl build_dir staging_dir bin 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-firmware
          path: bin/targets/mediatek/filogic/*.bin
          if-no-files-found: error
