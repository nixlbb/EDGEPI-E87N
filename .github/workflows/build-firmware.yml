name: Build E87N Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget \
            autoconf automake libtool libelf-dev pkg-config ccache
          df -h /

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: dl-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix samba4 relative include paths
        run: |
          mkdir -p lang/perl lang/python
          cp -f feeds/packages/lang/perl/perlver.mk lang/perl/perlver.mk
          cp -f feeds/packages/lang/python/python3-host.mk lang/python/ 2>/dev/null || true
          cp -f feeds/packages/lang/python/python3-package.mk lang/python/ 2>/dev/null || true
          ls -l lang/perl lang/python

      - name: Load E87N config
        run: |
          cp e87n.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y$' .config \
            || { echo "::error::目标设备不是 edgepi_e87n，配置未生效"; exit 1; }

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -nE "Error [0-9]|No space left|ERROR:|error:|Hash mismatch|Download failed|failed to build" build.log | tail -n 60 || true
          echo "===== 磁盘占用 ====="
          df -h /
          du -sh dl build_dir staging_dir bin 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-firmware
          path: bin/targets/mediatek/filogic/*.bin
          if-no-files-found: error
